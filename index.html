<header class="topbar">

  <div class="titles">

  <button id="soundBtn" class="icon-btn" type="button" aria-pressed="true" title="Bật/tắt âm thanh">🔊</button>

    <p class="verse">“Hãy sống theo Thần Khí” – Gl 5,16</p>
  </section>

  <section class="card overall">
    <div class="overall-head"><b id="ovMain"></b><span id="ovSub"></span></div>
    <div class="bar" id="ovBarWrap"><i id="ovBar"></i></div>
  </section>

  <div id="groups" style="display:grid;gap:14px"></div>

  <p class="footer-note">Tiến độ được lưu ngay trên thiết bị của bạn. <button id="resetAll" class="link-btn" type="button">Xoá toàn bộ tiến độ</button></p>
